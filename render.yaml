envVarGroups:
  # La cadena de conexión se configura UNA vez en Render (sync: false = secreto).
  # No se guarda en el repo porque el repositorio es público.
  - name: transacciones-db
    envVars:
      - key: DATABASE_URL
        sync: false

services:
  # 1. API Gateway
  - type: web
    name: transacciones-gateway
    runtime: node
    plan: free
    rootDir: servicios/gateway
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: transacciones-auth-service
          property: host
      - key: PRODUCTS_SERVICE_URL
        fromService:
          type: web
          name: transacciones-products-service
          property: host
      - key: ORDERS_SERVICE_URL
        fromService:
          type: web
          name: transacciones-orders-service
          property: host

  # 2. Microservicio de Autenticación & Usuarios
  - type: web
    name: transacciones-auth-service
    runtime: node
    plan: free
    rootDir: servicios/auth-service
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - fromGroup: transacciones-db
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true

  # 3. Microservicio de Productos
  - type: web
    name: transacciones-products-service
    runtime: node
    plan: free
    rootDir: servicios/products-service
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - fromGroup: transacciones-db
      - key: PORT
        value: 10000

  # 4. Microservicio de Precios & Facturación de Compras
  - type: web
    name: transacciones-orders-service
    runtime: node
    plan: free
    rootDir: servicios/orders-service
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - fromGroup: transacciones-db
      - key: PORT
        value: 10000
      - key: TAX_RATE
        value: 0.19
